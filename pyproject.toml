[project]
name = "toml-to-requirements"
version = "0.3.0"
description = "Convert a pyproject.toml file to a requirements.txt file"
authors = [{ name = "Jake Cyr", email = "cyrjake@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = ["toml", "requirements", "converter", "parser"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = ["toml>=0.10.2,<0.11", "packaging>=23.2"]

[project.scripts]
toml-to-req = "toml_to_requirements.main:main"

[dependency-groups]
dev = [
  "ruff>=0.3.5,<1",
  "pytest>=8.1.1,<10",
  "mypy>=1.9,<3",
  "coverage>=7.4.4,<8",
  "types-toml>=0.10.8.20240310",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

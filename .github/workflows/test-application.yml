name: Test Application

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with Ruff
        run: uv run --locked ruff check .
      - name: Check formatting with Ruff
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy toml_to_requirements
      - name: Test coverage
        run: |
          uv run --locked coverage run --source toml_to_requirements -m pytest
          uv run --locked coverage report --fail-under=90 --show-missing
      - name: Build distributions
        run: uv build
